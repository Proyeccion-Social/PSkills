name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de validación
        run: |
          pip install --quiet yamllint jsonschema
          npm install --quiet --save-dev @commitlint/cli @commitlint/config-conventional
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Validar sintaxis YAML
        run: |
          echo "Validando archivos YAML..."
          find . -path ./.git -prune -o -name "*.yml" -print -o -name "*.yaml" -print | while read -r f; do
            yamllint -d "{rules: {line-length: disable, trailing-spaces: disable}}" "$f" || exit 1
          done

      - name: Validar sintaxis JSON
        run: |
          echo "Validando archivos JSON..."
          find . -path ./.git -prune -o -name "*.json" -print | while read -r f; do
            jq empty "$f" || exit 1
          done

      - name: Validar JSON Schema (esquemas)
        if: github.event_name == 'pull_request'
        shell: python
        run: |
          import json, jsonschema, pathlib, sys

          print("Validando esquemas JSON en /schemas...")
          schemas_dir = pathlib.Path("schemas")
          errors = []

          if not schemas_dir.exists():
              print("Directorio /schemas no encontrado, se omite validación de esquemas.")
              sys.exit(0)

          for schema_file in schemas_dir.rglob("*.json"):
              try:
                  with open(schema_file, encoding="utf-8") as f:
                      schema = json.load(f)
                  jsonschema.Draft7Validator.check_schema(schema)
                  print(f"OK: {schema_file}")
              except Exception as e:
                  errors.append(f"{schema_file}: {e}")
                  print(f"ERROR: {schema_file}: {e}")

          if errors:
              print("\nErrores de validación de esquemas:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)

      - name: Validar prompts y datasets
        if: github.event_name == 'pull_request'
        shell: python
        run: |
          import pathlib, sys

          print("Validando consistencia de prompts y datasets...")
          errors = []
          prompts_dir = pathlib.Path("prompts")
          datasets_dir = pathlib.Path("datasets")

          for d in [prompts_dir, datasets_dir]:
              if not d.exists():
                  continue
              for f in d.rglob("*"):
                  if f.is_file() and f.suffix in [".txt", ".md", ".json", ".csv", ".jsonl"]:
                      try:
                          content = f.read_text(encoding="utf-8")
                          if not content.strip():
                              errors.append(f"{f}: archivo vacío")
                      except UnicodeDecodeError:
                          errors.append(f"{f}: no es texto UTF-8 válido")

          if errors:
              print("Errores de consistencia:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          print("Prompts y datasets válidos.")

      - name: Escaneo de secretos
        run: |
          echo "Escaneando secretos hardcodeados con TruffleHog..."
          trufflehog filesystem . --only-verified --no-cache || exit 1

      - name: Validar commits convencionales
        if: github.event_name == 'pull_request'
        run: |
          echo "Validando mensajes de commit convencionales..."
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" || exit 1

      - name: Validar plantilla de PR
        if: github.event_name == 'pull_request'
        run: |
          echo "Verificando plantilla de PR..."
          PR_BODY="${{ github.event.pull_request.body }}"
          if [ -z "$PR_BODY" ]; then
            echo "ERROR: El PR no tiene cuerpo. Usa la plantilla de pull request."
            exit 1
          fi
          for item in "Cambios probados localmente" "No hay secretos ni credenciales hardcodeados" "Revisión de seguridad"; do
            if ! echo "$PR_BODY" | grep -q "$item"; then
              echo "ERROR: Falta ítem obligatorio en la plantilla: $item"
              exit 1
            fi
          done
          echo "Plantilla de PR válida."

      - name: Revisión de seguridad (skill pr-review)
        if: github.event_name == 'pull_request'
        run: |
          echo "Ejecutando revisión de seguridad con la skill pr-review..."
          # Invocar la skill pr-review del equipo para verificar ausencia de fugas de seguridad.
          # Ajustar la invocación según la interfaz de la skill disponible en el entorno de Composio.
          echo "Paso pendiente de integración con la skill pr-review. Verificar manualmente que no haya fugas de seguridad."
